    /* =====================================================
       OUTILS
    ====================================================== */

    function initiale(nom) {

      return nom
        ? nom.charAt(0).toUpperCase()
        : '?';

    }



    function formatHeure(dateStr) {

      const d =
        new Date(dateStr);


      if (
        Number.isNaN(
          d.getTime()
        )
      ) {

        return '';

      }


      return (

        d.getHours()
          .toString()
          .padStart(2, '0')

        +

        ':'

        +

        d.getMinutes()
          .toString()
          .padStart(2, '0')

      );

    }



    function echapperHTML(texte) {

      const div =
        document.createElement(
          'div'
        );


      div.textContent =
        texte || '';


      return div.innerHTML;

    }

/* =====================================================
   CHARGER MON PROFIL
===================================================== */

async function chargerMonProfil() {

  try {

    const res =
      await fetch(API_BASE_URL + '/api/auth/me',
        {

          headers: {

            'Authorization':
              'Bearer ' + token

          }

        }
      );


    if (!res.ok) {

      localStorage.clear();

      window.location.href =
        'index.html';

      return;

    }


    const me =
      await res.json();


    myUserId =
      me._id;


    localStorage.setItem(
      'userId',
      myUserId
    );


    const statut =
      me.status === 'actif'
        ? 'actif'
        : 'inactif';


    const myProfile =
      document.getElementById(
        'myProfile'
      );


    if (!myProfile) {

      return;

    }


    myProfile.innerHTML =

      '<div class="my-profile-avatar-wrapper">' +

        '<button ' +
          'class="avatar my-profile-chat-btn" ' +
          'type="button" ' +
          'title="Aucune conversation">' +

          initiale(
            me.username
          ) +

        '</button>' +

        '<span class="status-dot ' +
          statut +
        '"></span>' +

      '</div>' +


      '<div class="my-profile-name">' +

        '<strong>' +

          echapperHTML(
            me.username
          ) +

        '</strong>' +

        '<span class="my-profile-label">' +

          (
            statut === 'actif'
              ? 'En ligne'
              : 'Hors ligne'
          ) +

        '</span>' +

      '</div>';


      


    const logoutContainer =
      document.getElementById('logoutContainer');

    if (logoutContainer) {
      logoutContainer.innerHTML =
        '<button ' +
        'class="logout-btn" ' +
        'type="button" ' +
        'title="Déconnexion" ' +
        'onclick="seDeconnecter()">' +
        'Déconnexion' +
        '</button>';
    }

    const avatarBouton =
      myProfile.querySelector(
        '.my-profile-chat-btn'
      );


    if (avatarBouton) {

      avatarBouton.addEventListener(
        'click',
        afficherAucuneConversation
      );

    }


  } catch (err) {

    console.error(
      'Erreur chargement profil :',
      err
    );

  }

}

    /* =====================================================
       CHARGER UTILISATEURS
    ====================================================== */

    async function chargerUtilisateurs() {
        try {
          const res = await fetch(
            API_BASE_URL + '/api/users',
            {
              headers: {
                'Authorization': 'Bearer ' + token
              }
            }
          );

          if (!res.ok) {
            console.error(
              'Erreur /api/users :',
              res.status
            );
            return;
          }

          const texteReponse =
            await res.text();

          usersData =
            JSON.parse(texteReponse);

          if (!Array.isArray(usersData)) {
            usersData = [];
          }

          afficherUtilisateurs();

        } catch (err) {
          console.error(
            'Erreur chargement utilisateurs :',
            err
          );
        }
      }

      async function chargerMessagesNonLus() {

      try {

        const res =
          await fetch(API_BASE_URL + '/api/messages/unread-counts',
            {

              headers: {

                'Authorization':
                  'Bearer ' + token

              }

            }
          );


        if (!res.ok) {

        }

    /* =====================================================
       AFFICHER UTILISATEURS
    ====================================================== */

    function afficherUtilisateurs() {

      const container =
        document.getElementById(
          'usersScroll'
        );


      if (!container) {

        return;

      }


      container.innerHTML =
        '';


      usersData.forEach(
        u => {

          if (
            !u ||
            !u._id
          ) {

            return;

          }


          const div =
            document.createElement(
              'div'
            );


          div.className =
            'user-item' +

            (
              String(u._id) ===
              String(selectedUserId)

                ? ' active'

                : ''
            );


          const nombreNonLu =
            unreadCounts[
              u._id
            ] || 0;


          const badge =

            nombreNonLu > 0

              ?

              '<span class="unread-badge">' +

                nombreNonLu +

              '</span>'

              :

              '';


          div.innerHTML =

            '<div class="user-avatar-wrapper">' +

              '<span class="avatar">' +

                initiale(
                  u.username
                ) +

              '</span>' +

              '<span class="status-dot ' +

                (
                  u.status === 'actif'
                    ? 'actif'
                    : 'inactif'
                ) +

              '"></span>' +

            '</div>' +


            '<div class="user-name-container">' +

              '<span class="user-name">' +

                echapperHTML(
                  u.username
                ) +

              '</span>' +

              badge +

            '</div>';


          div.addEventListener(
            'click',
            () => {

              ouvrirConversation(
                u._id
              );

            }
          );


          container.appendChild(
            div
          );

        }
      );

    }



    /* =====================================================
       OUVRIR CONVERSATION
    ====================================================== */

    async function ouvrirConversation(
      userId
    ) {

      selectedUserId =
        String(userId);


      const user =
        usersData.find(
          u =>

            String(u._id) ===
            String(userId)
        );


      if (!user) {

        return;

      }


      unreadCounts[
        userId
      ] = 0;


      afficherUtilisateurs();


      document
        .getElementById(
          'convPlaceholder'
        )
        .style.display =
          'none';


      document
        .getElementById(
          'convActive'
        )
        .style.display =
          'flex';


      document
        .getElementById(
          'convUsername'
        )
        .textContent =
          user.username;


      document
        .getElementById(
          'convAvatar'
        )
        .textContent =

          initiale(
            user.username
          );


      const statusElement =
        document.getElementById(
          'convStatus'
        );


      statusElement.innerHTML =

        '<span class="status-dot ' +

        (
          user.status === 'actif'
            ? 'actif'
            : 'inactif'
        ) +

        '"></span> ' +

        (
          user.status === 'actif'
            ? 'En ligne'
            : 'Hors ligne'
        );


      const box =
        document.getElementById(
          'messages'
        );


      box.innerHTML =
        '';


      try {

        const res =
          await fetch(API_BASE_URL + '/api/messages/' +
            userId,
            {

              headers: {

                'Authorization':
                  'Bearer ' + token

              }

            }
          );


        if (!res.ok) {

          return;

        }


        const messages =
          await res.json();


        messages.forEach(
          msg => {

            afficherMessage(
              msg
            );

          }
        );


        box.scrollTop =
          box.scrollHeight;


      } catch (err) {

        console.error(
          'Erreur chargement messages :',
          err
        );

      }


      try {

        await fetch(API_BASE_URL + '/api/messages/' +
          userId +
          '/read',
          {

            method:
              'POST',

            headers: {

              'Authorization':
                'Bearer ' + token

            }

          }
        );

      } catch (err) {

        console.error(
          'Erreur lecture :',
          err
        );

      }

    }



    /* =====================================================
       AFFICHER UN MESSAGE
    ====================================================== */

    function afficherMessage(
      msg
    ) {

      if (!msg) {

        return;

      }


      const box =
        document.getElementById(
          'messages'
        );


      if (!box) {

        return;

      }


      const senderId =
        String(
          msg.sender
        );


      const estMoi =
        senderId ===
        String(
          myUserId
        );


      const div =
        document.createElement(
          'div'
        );


      div.className =
        estMoi

          ? 'message message-sent'

          : 'message message-received';


      if (
          msg.messageType === 'audio' &&
          msg.audioUrl
        ) {

          const audioUrl =
            String(
              msg.audioUrl
            );

          const audioSrc =
            audioUrl.startsWith('http')
              ? audioUrl
              : API_BASE_URL + audioUrl;

          div.innerHTML =

            '<div class="message-audio">' +

              '<audio ' +
                'controls ' +
                'preload="metadata" ' +
                'src="' +
                  echapperHTML(audioSrc) +
                '">' +
              '</audio>' +

            '</div>' +

            '<div class="message-time">' +

              formatHeure(
                msg.timestamp
              ) +

            '</div>';

        } else {

          div.innerHTML =

            '<div class="message-text">' +

              echapperHTML(
                msg.message
              ) +

            '</div>' +

            '<div class="message-time">' +

              formatHeure(
                msg.timestamp
              ) +

            '</div>';

        }


        box.appendChild(
        div
      );


      box.scrollTop =
        box.scrollHeight;

    }



    /* =====================================================
       ENVOYER MESSAGE
    ====================================================== */

    function envoyerMessage() {

      const input =
        document.getElementById(
          'messageInput'
        );


      const sendBtn =
        document.getElementById(
          'sendBtn'
        );


      if (!input) {

        return;

      }


      const message =
        input.value.trim();


      if (!message) {

        return;

      }


      if (!selectedUserId) {

        return;

      }


      if (!socket.connected) {

        alert(
          'Connexion au serveur perdue.'
        );

        return;

      }


      if (sendBtn) {

        sendBtn.disabled =
          true;

      }


      socket.emit(

        'sendMessage',

        {

          receiverId:
            String(
              selectedUserId
            ),

          message:
            message

        },

        (response) => {


          console.log(
            'Réponse serveur :',
            response
          );


          /* IMPORTANT :
             le serveur renvoie response.ok
          */

          if (

            response &&
            response.ok

          ) {

            input.value =
              '';

          }


          if (sendBtn) {

            sendBtn.disabled =
              false;

          }


          if (

            !response ||
            !response.ok

          ) {

            console.error(
              'Échec de l’envoi :',
              response
            );

          }

        }

      );

    }

function choisirFormatAudio() {
  const formats = [
    'audio/mp4',
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus'
  ];

  for (const format of formats) {
    if (
      typeof MediaRecorder.isTypeSupported === 'function' &&
      MediaRecorder.isTypeSupported(format)
    ) {
      return format;
    }
  }

  return '';
}

function obtenirExtensionAudio(type) {
  if (type.includes('mp4')) return '.mp4';
  if (type.includes('ogg')) return '.ogg';
  return '.webm';
}

function mettreAJourTimerAudio() {
  const timer =
    document.getElementById('audioRecordingTimer');

  if (!timer || !audioRecordingStartedAt) {
    return;
  }

  const now = Date.now();

  let elapsed =
    now -
    audioRecordingStartedAt -
    audioRecordingPausedDuration;

  if (audioRecordingPausedAt) {
    elapsed -= now - audioRecordingPausedAt;
  }

  elapsed = Math.max(0, elapsed);

  const totalSeconds =
    Math.floor(elapsed / 1000);

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  timer.textContent =
    String(minutes).padStart(2, '0') +
    ':' +
    String(seconds).padStart(2, '0');
}

async function envoyerAudioBlob(blob) {
  if (!blob || !blob.size) {
    throw new Error(
      'Aucun message vocal à envoyer.'
    );
  }

  if (!selectedUserId) {
    throw new Error(
      'Sélectionnez d’abord un destinataire.'
    );
  }

  const formData =
    new FormData();

  const extension =
    obtenirExtensionAudio(
      blob.type
    );

  formData.append(
    'audio',
    blob,
    'message-vocal' + extension
  );

  const uploadResponse =
    await fetch(
      API_BASE_URL +
      '/api/audio/upload',
      {
        method: 'POST',
        headers: {
          'Authorization':
            'Bearer ' + token
        },
        body: formData
      }
    );

  const uploadResult =
    await uploadResponse.json();

  if (
    !uploadResponse.ok ||
    !uploadResult.ok ||
    !uploadResult.audioUrl
  ) {
    throw new Error(
      uploadResult.error ||
      'Impossible d’envoyer le message vocal.'
    );
  }

  const receiverId =
    String(selectedUserId);

  const response =
    await new Promise(
      (resolve) => {
        socket.emit(
          'sendAudioMessage',
          {
            receiverId:
              receiverId,
            audioUrl:
              uploadResult.audioUrl
          },
          resolve
        );
      }
    );

  if (
    !response ||
    !response.ok
  ) {
    throw new Error(
      response &&
      response.error
        ? response.error
        : 'Impossible d’envoyer le message vocal.'
    );
  }

  return response;
}


async function demarrerEnregistrementAudio() {
  console.log(
    '===== DEMARRAGE ENREGISTREMENT AUDIO ====='
  );

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {
    alert(
      'Votre navigateur ne permet pas l’accès au microphone.'
    );
    return;
  }

  if (!selectedUserId) {
    alert(
      'Sélectionnez d’abord un destinataire.'
    );
    return;
  }

  if (
    mediaRecorder &&
    mediaRecorder.state !== 'inactive'
  ) {
    return;
  }

  try {
    audioRecordingStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioChunks = [];

    const mimeType =
      choisirFormatAudio();

    mediaRecorder =
      mimeType
        ? new MediaRecorder(
            audioRecordingStream,
            { mimeType }
          )
        : new MediaRecorder(
            audioRecordingStream
          );

    mediaRecorder.addEventListener(
      'dataavailable',
      (event) => {
        if (
          event.data &&
          event.data.size > 0
        ) {
          audioChunks.push(event.data);
        }
      }
    );

    mediaRecorder.addEventListener(
      'stop',
      () => {
        const actualMimeType =
          mediaRecorder.mimeType ||
          mimeType ||
          'audio/webm';

        const audioBlob =
          new Blob(
            audioChunks,
            {
              type: actualMimeType
            }
          );

        if (audioRecordingStream) {
          audioRecordingStream
            .getTracks()
            .forEach(
              (track) => track.stop()
            );

          audioRecordingStream = null;
        }

        audioChunks = [];

        if (!audioBlob.size) {
          alert(
            'Aucun audio enregistré.'
          );
          return;
        }

        audioPreviewBlob =
          audioBlob;

        if (audioPreviewUrl) {
          URL.revokeObjectURL(
            audioPreviewUrl
          );
        }

        audioPreviewUrl =
          URL.createObjectURL(
            audioBlob
          );

        const previewPlayer =
          document.getElementById(
            'audioPreviewPlayer'
          );

        if (previewPlayer) {
          previewPlayer.src =
            audioPreviewUrl;
          previewPlayer.load();
        }

        if (envoyerAudioApresStop) {
          envoyerAudioApresStop = false;

          console.log(
            'Envoi automatique du message vocal'
          );

          envoyerAudioBlob(
            audioBlob
          )
            .then(
              () => {
                if (audioPreviewUrl) {
                  URL.revokeObjectURL(
                    audioPreviewUrl
                  );
                }

                audioPreviewUrl = null;
                audioPreviewBlob = null;

                if (previewPlayer) {
                  previewPlayer.pause();
                  previewPlayer.removeAttribute(
                    'src'
                  );
                  previewPlayer.load();
                }

                if (audioPreviewContainer) {
                  audioPreviewContainer.hidden =
                    true;
                }

                console.log(
                  'Message vocal envoyé automatiquement'
                );
              }
            )
            .catch(
              (err) => {
                console.error(
                  'Erreur envoi automatique vocal :',
                  err
                );

                alert(
                  err.message ||
                  'Impossible d’envoyer le message vocal.'
                );

                if (audioPreviewContainer) {
                  audioPreviewContainer.hidden =
                    false;
                }
              }
            );

          return;
        }

        if (audioPreviewContainer) {
          audioPreviewContainer.hidden =
            false;
        }

        console.log(
          'Aperçu vocal prêt :',
          audioBlob.type,
          audioBlob.size,
          'octets'
        );
      }
    );

    mediaRecorder.start();

    isRecording = true;

    audioRecordingStartedAt =
      Date.now();

    audioRecordingPausedAt = 0;
    audioRecordingPausedDuration = 0;

    afficherControlesEnregistrement();
    reinitialiserControlesEnregistrement();

    clearInterval(
      audioRecordingTimerInterval
    );

    audioRecordingTimerInterval =
      setInterval(
        mettreAJourTimerAudio,
        250
      );

    const recordBtn =
      document.getElementById(
        'recordAudioBtn'
      );

    if (recordBtn) {
      recordBtn.classList.add(
        'recording'
      );

      recordBtn.setAttribute(
        'aria-label',
        'Enregistrement vocal en cours'
      );
    }

    console.log(
      'Enregistrement vocal démarré'
    );
  } catch (err) {
    console.error(
      'Erreur accès microphone :',
      err
    );

    if (audioRecordingStream) {
      audioRecordingStream
        .getTracks()
        .forEach(
          (track) => track.stop()
        );

      audioRecordingStream = null;
    }

    alert(
      'Impossible d’accéder au microphone.'
    );
  }
}

function reprendreEnregistrementAudio() {

    mediaRecorder.state !== 'paused'
  ) {

  if (audioRecordingPausedAt) {
    audioRecordingPausedDuration +=
      Date.now() -

    audioRecordingPausedAt = 0;

  mediaRecorder.resume();

  const pauseBtn =
    document.getElementById(
      'pauseAudioBtn'
    );

  const resumeBtn =
    document.getElementById(

    resumeBtn.hidden = true;

  console.log(
    'Enregistrement vocal repris'
  );
}

/* =====================================================

async function activerNotificationsPush() {

  try {

    // Vérifier que le navigateur prend en charge les notifications
    if (
      !('Notification' in window) ||
      !('serviceWorker' in navigator) ||
      !('PushManager' in window)
    ) {

      console.log(
        'Notifications Push non supportées par ce navigateur.'
      );

      return;

    }


    // Demander l'autorisation
    const permission =
      await Notification.requestPermission();


    if (permission !== 'granted') {

      console.log(
        'Autorisation des notifications refusée.'
      );

      return;

    }


    // Récupérer le Service Worker
    const registration =
      await navigator.serviceWorker.ready;


    // Récupérer la clé publique VAPID
    const vapidResponse =
      await fetch(API_BASE_URL + '/api/notifications/vapid-public-key',
        {

          headers: {

            'Authorization':
              'Bearer ' + token

          }

        }
      );


    if (!vapidResponse.ok) {

      console.error(
        'Impossible de récupérer la clé publique VAPID.'
      );

      return;

    }


    const vapidData =
      await vapidResponse.json();


    if (!vapidData.publicKey) {

      console.error(
        'Clé publique VAPID absente.'
      );

      return;

    }


    // Convertir la clé VAPID
    function urlBase64ToUint8Array(base64String) {

      const padding =
        '='.repeat(
          (4 - base64String.length % 4) % 4
        );

      const base64 =
        (
          base64String +
          padding
        )
        .replace(/-/g, '+')
        .replace(/_/g, '/');


      const rawData =
        window.atob(base64);


      return Uint8Array.from(
        [...rawData].map(
          char => char.charCodeAt(0)
        )
      );

    }


    // Vérifier s'il existe déjà un abonnement
    let subscription =
      await registration.pushManager.getSubscription();


    // Créer l'abonnement s'il n'existe pas
    if (!subscription) {

      subscription =
        await registration.pushManager.subscribe({

          userVisibleOnly: true,

          applicationServerKey:
            urlBase64ToUint8Array(
              vapidData.publicKey
            )

        });

    }


    // Envoyer l'abonnement au serveur
    const subscribeResponse =
      await fetch(API_BASE_URL + '/api/notifications/subscribe',
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json',

            'Authorization':
              'Bearer ' + token

          },

          body:
            JSON.stringify(
              subscription
            )

        }
      );


    if (!subscribeResponse.ok) {

      const erreur =
        await subscribeResponse.text();

      console.error(
        'Erreur enregistrement Push :',
        erreur
      );

      return;

    }


    console.log(
      '🔔 Notifications Push activées avec succès.'
    );


  } catch (err) {

    console.error(
      'Erreur activation notifications Push :',
      err
    );

  }

  }

<script>
(function () {
  const chatApp = document.querySelector(".chat-app");
  if (!chatApp) return;

  let startX = 0;
  let startY = 0;

  chatApp.addEventListener("touchstart", function (e) {
    if (!e.touches.length) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  chatApp.addEventListener("touchend", function (e) {
    if (!e.changedTouches.length) return;

    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - startX;
    const dy = endY - startY;

    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;

    if (dx < 0) {
      chatApp.classList.add("users-collapsed");
    } else {
      chatApp.classList.remove("users-collapsed");
    }
  }, { passive: true });
})();
</script>

<script>
/* =====================================================
   MODE VOCAL — MASQUER APPEL + ENVOI TEXTE
===================================================== */

(function () {

  function estVisible(element) {
    if (!element) return false;
    const style = window.getComputedStyle(element);

    return (
      style.display !== "none" &&
      style.visibility !== "hidden" &&
      element.offsetWidth > 0 &&
      element.offsetHeight > 0
    );
  }

  function verifierModeVocal() {

    const messageRow =
      document.querySelector(".message-input-row");

    if (!messageRow) return;

    const audioControls =
      document.querySelector(".audio-controls");

    const audioPreview =
      document.querySelector(".audio-preview");

    const recordingControls =
      document.querySelector(".recording-controls");

    const vocalActif =
      estVisible(audioControls) ||
      estVisible(audioPreview) ||
      estVisible(recordingControls);

    messageRow.classList.toggle(
      "audio-mode",
      vocalActif
    );
  }


  document.addEventListener(
    "DOMContentLoaded",
    function () {

      verifierModeVocal();

      const observer =
        new MutationObserver(verifierModeVocal);

      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: [
            "style",
            "class",
            "hidden"
          ]
        }
      );

    }
  );

})();
</script>
